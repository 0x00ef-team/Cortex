[package]
name = "cortex-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "From-scratch Rust inference engine for LLaMA-style language models (GGUF, quantized weights, KV cache, BPE, sampling)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x00ef-team/cortex-llm"
keywords = ["llm", "inference", "gguf", "transformer", "rust"]
categories = ["science", "command-line-utilities"]

[lib]
name = "cortex"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "matvec"
harness = false
